<!DOCTYPE html>
<html>
  <body>
    <h1>Rendered in Server Side</h1>
    <uibeam-button>
      <template shadowrootmode="open">
        <p>Hello, DSD!</p><button type="button">Button in DSD</button>
      </template>
    </uibeam-button>
    <button id="log-track-button">
        Click to log track
    </button>
    <script>
      customElements.define(
        "uibeam-button",
        class extends HTMLElement {
          constructor() {
            super();
          }
          connectedCallback() {
            const root = this.shadowRoot;
            console.log("root:", root);
            const intermidiateTextNode = root.firstChild;
            console.log("intermediateTextNode:", intermidiateTextNode);
            const p = root.firstChild.nextSibling;
            console.log("p:", p);
            const button = root.firstChild.nextSibling.nextSibling;
            console.log("button:", button);
            button.addEventListener(
              "click",
              (e) => {
                console.log("[click]", e);
              }
            );
          }
        }
      );
      document.getElementById("log-track-button").addEventListener(
        "click",
        (e) => {
          console.log("body:", document.body);
          console.log("body.firstChild:", document.body.firstChild);
          console.log("body.firstChild.nextSibling:", document.body.firstChild.nextSibling);
          console.log("body.firstChild.nextSibling.nextSibling:", document.body.firstChild.nextSibling.nextSibling);
          console.log("body.firstChild.nextSibling.nextSibling.nextSibling:", document.body.firstChild.nextSibling.nextSibling.nextSibling);
          console.log(
            "body.firstChild.nextSibling.nextSibling.nextSibling.shadowRoot:",
            document.body.firstChild.nextSibling.nextSibling.nextSibling.shadowRoot
          );
          const shadowRoot = document.body.firstChild.nextSibling.nextSibling.nextSibling.shadowRoot;
          console.log("shadowRoot.firstChild:", shadowRoot.firstChild);
          console.log("shadowRoot.firstChild.nextSibling:", shadowRoot.firstChild.nextSibling);
          console.log("shadowRoot.firstChild.nextSibling.nextSibling:", shadowRoot.firstChild.nextSibling.nextSibling);
          console.log("shadowRoot.firstChild.nextSibling.nextSibling.nextSibling:", shadowRoot.firstChild.nextSibling.nextSibling.nextSibling);
        }
      );
    </script>
  </body>
</html>
